    <!--
      Tipografía: familia Archivo (Omnibus-Type), bajo SIL Open Font License 1.1.
      Se eligió por el criterio de identidad: sans, gruesa, y con licencia que
      permite uso comercial sin pagar ni pedir permiso.
        · Archivo Black  → títulos y piezas de cartel
        · Archivo 400-700 → texto de interfaz
      Antes el CSS declaraba 'Inter' pero nunca la cargaba: se veía la sans por
      defecto de cada sistema operativo, distinta en cada computadora.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Black&display=swap"
      rel="stylesheet"
    />
